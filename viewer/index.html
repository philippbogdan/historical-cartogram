<!doctype html>
<html><head><meta charset="utf-8"><title>historical-cartogram: data viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0;background:#000}#info{position:absolute;top:8px;left:50px;z-index:1000;color:#ddd;font:12px/1.4 -apple-system,sans-serif;background:#0008;padding:6px 8px;border-radius:4px}</style>
</head><body><div id="map"></div><div id="info">loading</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
fetch('/meta').then(r=>r.json()).then(m=>{
  const map=L.map('map',{crs:L.CRS.EPSG4326,center:[20,20],zoom:2,minZoom:1,maxZoom:m.maxZoom,zoomSnap:0.25,wheelPxPerZoomLevel:90});
  L.tileLayer('/tiles/{z}/{x}/{y}.png',{tileSize:256,maxNativeZoom:m.maxZoom,maxZoom:m.maxZoom+2,noWrap:true,bounds:[[-90,-180],[90,180]]}).addTo(map);
  const info=document.getElementById('info');
  const upd=()=>{const c=map.getCenter();info.textContent=`${m.file}  cell ${(m.cell_deg*3600).toFixed(1)}"  zoom ${map.getZoom().toFixed(2)}  ${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}  log10 people/km2, magma`;};
  map.on('moveend zoomend',upd);upd();
});
</script></body></html>

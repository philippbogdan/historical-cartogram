<!doctype html><html><head><meta charset="utf-8"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script><style>html,body,#map{margin:0;height:100%}</style></head><body><div id="map"></div><script>
const protocol = new pmtiles.Protocol(); maplibregl.addProtocol("pmtiles", protocol.tile);
const src = new URLSearchParams(location.search).get('src') || 'admin1'; const layer = new URLSearchParams(location.search).get('layer') || src;
window.map = new maplibregl.Map({ container: "map", style: { version: 8, sources: { s: { type: "vector", url: "pmtiles://tiles/" + src + ".pmtiles" } }, layers: [ { id: "bg", type: "background", paint: { "background-color": "#eee" } }, { id: "f", type: "fill", source: "s", "source-layer": layer, paint: { "fill-color": "#c33", "fill-opacity": 0.6 } }, { id: "l", type: "line", source: "s", "source-layer": layer, paint: { "line-color": "#000", "line-width": 1 } } ] }, center: [45, -10], zoom: 5, renderWorldCopies: false });
map.on('error', e => console.log('MAPERR ' + (e.error && e.error.message)));
</script></body></html>

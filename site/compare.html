<!doctype html><html><head><meta charset="utf-8"><title>compare</title>
<style>body{font:14px/1.4 -apple-system,sans-serif;background:#0b0d12;color:#ddd;margin:0;padding:16px}a{color:#7cc}#wrap{position:relative;max-width:1100px;margin:0 auto}#wrap img{display:block;width:100%}#top{position:absolute;top:0;left:0;height:100%;overflow:hidden;width:50%;border-right:2px solid #fff}#top img{width:1100px;max-width:none}#r{width:100%;margin-top:8px}select{margin:0 8px;background:#223;color:#fff;border:0;padding:4px}</style></head>
<body><p>Swipe: <select id="a"></select> against <select id="b"></select> <a href="index.html">about</a></p>
<div id="wrap"><img id="ib" src=""><div id="top"><img id="ia" src=""></div></div><input id="r" type="range" min="0" max="100" value="50">
<script>
const opts={"today, people":"img/today_countries.jpg","GDP world":"img/lens_gdp.jpg","loneliness (1/density)":"img/lens_lonely.jpg","light per person":"img/lens_lights.jpg","roads per person":"img/lens_roads.jpg","person-years since 10,000 BC":"img/lens_personyears.jpg","diffusion method":"img/method_diffusion.jpg","anti-cartogram":"img/method_antigravity.jpg","peak year":"img/lens_peak.jpg"};
const A=document.getElementById('a'),B=document.getElementById('b'); for(const k in opts){A.add(new Option(k,opts[k]));B.add(new Option(k,opts[k]));} A.selectedIndex=0;B.selectedIndex=1;
const ia=document.getElementById('ia'),ib=document.getElementById('ib'),topEl=document.getElementById('top'),wrap=document.getElementById('wrap');
function upd(){ia.src=A.value;ib.src=B.value;} A.onchange=B.onchange=upd; upd();
const fit=()=>{ia.style.width=wrap.clientWidth+'px';}; addEventListener('resize',fit); setTimeout(fit,100);
document.getElementById('r').oninput=e=>{topEl.style.width=e.target.value+'%';};
</script></body></html>

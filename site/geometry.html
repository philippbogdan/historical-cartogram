<h1>The population manifold, kept curved</h1><p>Give the map the metric g = (ρ/ρ̄)(dx² + dy²): areas are people, angles are geographic, and it is curved. The cartogram is what you get by flattening it; these pictures leave it curved.</p>
<figure><a href="img/geo_curvature.jpg"><img src="img/geo_curvature.jpg" loading="lazy"></a><figcaption>Gaussian curvature as colour: red on the tops of population hills, blue in the saddles between cities.</figcaption></figure>
<figure><a href="img/geo_geodesics.jpg"><img src="img/geo_geodesics.jpg" loading="lazy"></a><figcaption>Geodesics fanning out from London, Delhi and São Paulo: the straight lines of the humeter world bend away from dense regions like light around a lens.</figcaption></figure>
<figure><a href="img/geo_distance.jpg"><img src="img/geo_distance.jpg" loading="lazy"></a><figcaption>Humeter distance from four cities, contours every 2000 hm-km. Crossing India costs more than crossing the Atlantic.</figcaption></figure>
<figure><a href="img/geo_lumpy.jpg"><img src="img/geo_lumpy.jpg" loading="lazy"></a><figcaption>The lumpy Earth, first version: a relief globe whose radius follows the humeter scale, so the Ganges plain and eastern China stand out as lobes. The true embedding, a closed surface whose area is people, is still open (A10).</figcaption></figure>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="The power diagram of humanity. An interactive figure in black ink.">
  <title>Humeter</title>
  <link rel="icon" href="human-space/icon.svg?v=6c865740be67" type="image/svg+xml">
  <link rel="stylesheet" href="human-space/style.css?v=ed48f12e4d24">
  <script type="module" src="human-space/app.js?v=7f7a5cf1e962"></script>
</head>
<body>
  <div class="selectors">
    <fieldset aria-label="Colour">
      <label><input type="radio" name="colour" value="0">monotone</label>
      <label><input type="radio" name="colour" value="1" checked>countries</label>
      <label><input type="radio" name="colour" value="2">continents</label>
    </fieldset>
    <fieldset aria-label="Representation">
      <label><input type="radio" name="representation" value="dots">dots</label>
      <label><input type="radio" name="representation" value="polygons" checked>polygons</label>
    </fieldset>
    <fieldset aria-label="Gravity">
      <label><input type="radio" name="gravity" value="0" checked>push</label>
      <label><input type="radio" name="gravity" value="1">pull</label>
    </fieldset>
  </div>
  <button id="expand" aria-label="Expand map" title="Expand map"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fs-enter" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/><path class="fs-exit" d="M3 9h6V3m6 0v6h6M9 21v-6H3m18 0h-6v6"/></svg></button>
  <canvas id="polygons" aria-hidden="true"></canvas>
  <div id="labels"></div>
  <canvas id="map" tabindex="0" role="img" aria-label="Figure 6, the power diagram of humanity. Each dot or polygon represents about one million people. Push spreads dense regions outward. Pull attracts the surroundings into dense rims. The map moves slowly between geography and the selected force field. Tap or press Space to pause or resume. Drag to pan, scroll or pinch to zoom. Left and right arrows change the view. Home resets the zoom. F toggles fullscreen; Escape exits fullscreen or pauses the animation."></canvas>
</body>
</html>

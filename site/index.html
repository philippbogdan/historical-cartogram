<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Human geography in black ink dots.">
  <title>Humeter</title>
  <link rel="icon" href="human-space/icon.svg?v=6c865740be67" type="image/svg+xml">
  <link rel="stylesheet" href="human-space/style.css?v=20c11e7650d5">
  <script type="module" src="human-space/app.js?v=0475384aa8f1"></script>
</head>
<body>
  <div class="selectors">
    <fieldset aria-label="Colour">
      <label><input type="radio" name="colour" value="0" checked>monotone</label>
      <label><input type="radio" name="colour" value="1">countries</label>
      <label><input type="radio" name="colour" value="2">continents</label>
    </fieldset>
    <fieldset aria-label="Representation">
      <label><input type="radio" name="representation" value="dots" checked>dots</label>
      <label><input type="radio" name="representation" value="polygons">polygons</label>
    </fieldset>
  </div>
  <canvas id="polygons" hidden aria-hidden="true"></canvas>
  <canvas id="map" tabindex="0" role="img" aria-label="Population cartogram. Each dot or polygon represents about one million people. The same dots move between geography and human space. Tap or press Space to pause. Drag to pan, scroll or pinch to zoom. Left and right arrows change the view. Home resets the zoom."></canvas>
</body>
</html>
